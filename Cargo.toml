[package]
name = "source_harness"
version = "0.1.0"
edition = "2021"
description = "Responses API native SourceHarness tool kernel and stateless transport loop"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
