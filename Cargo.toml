[package]
name = "source_harness"
version = "0.1.0"
edition = "2021"
description = "Responses API native SourceHarness tool kernel and stateless transport loop"
license = "MIT"
repository = "https://github.com/qq824045252-ship-it/SourceHarness"

[dependencies]
diffy = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
